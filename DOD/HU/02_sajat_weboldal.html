<!doctype html>
<html lang="hu">
<meta charset="utf-8">
<style>
body { background: #152440; color: white; font-family: Arial; text-align: center; padding: 35px; }
h1 { color: #55e4e7; }
button { background: #55e4e7; border: 0; padding: 15px; font-size: 18px; cursor: pointer; }
input { padding: 12px; font-size: 18px; max-width: 90%; }
</style>
<h1>Az első saját oldalam</h1>
<p>Mi a beceneved?</p>
<input id="nev" placeholder="Pl. Pixel" maxlength="30">
<button onclick="koszont()">Köszönj!</button>
<h2 id="uzenet">Itt jelenik meg az üzeneted.</h2>
<!-- TITKOS KÜLDETÉS: a következő sorból töröld a hidden szót! -->
<p hidden>★ Megtaláltad a titkos üzenetet!</p>
<script>
function koszont() {
    const nev = document.getElementById('nev').value.trim();
    document.getElementById('uzenet').textContent =
        nev ? 'Szia, ' + nev + '! Ezt már te irányítod.' : 'Előbb írj be egy becenevet!';
}
</script>
</html>
