<!doctype html><html lang="hu"><meta charset="utf-8"><title>Webműhely</title><link rel="stylesheet" href="stilus.css"><main><a href="index.html">← Állomások</a><h1>A weboldal, amit te alakítasz</h1><p>1. Írd át a „Köszönj!” gomb szövegét.</br>2. Találd meg a <b>hidden</b> szót, és töröld. </br>3. Próbálj más háttérszínt!</p><button id="update">Változtatások megjelenítése ▶</button><p id="status" role="status"></p><div class="cols"><textarea id="source" aria-label="Weboldal forráskódja" spellcheck="false"></textarea><iframe id="preview" sandbox="allow-scripts" title="A saját oldalad"></iframe></div><p class="note">A becenév csak ezen a gépen jelenik meg. A próbaoldal nem küldi el sehova.</p></main><script>
const starter="<!doctype html>\n<html lang=\"hu\">\n<meta charset=\"utf-8\">\n<style>\nbody { background: #152440; color: white; font-family: Arial; text-align: center; padding: 35px; }\nh1 { color: #55e4e7; }\nbutton { background: #55e4e7; border: 0; padding: 15px; font-size: 18px; cursor: pointer; }\ninput { padding: 12px; font-size: 18px; max-width: 90%; }\n</style>\n<h1>Az első saját oldalam</h1>\n<p>Mi a beceneved?</p>\n<input id=\"nev\" placeholder=\"Pl. Pixel\" maxlength=\"30\">\n<button onclick=\"koszont()\">Köszönj!</button>\n<h2 id=\"uzenet\">Itt jelenik meg az üzeneted.</h2>\n<!-- TITKOS KÜLDETÉS: a következő sorból töröld a hidden szót! -->\n<p hidden>★ Megtaláltad a titkos üzenetet!</p>\n<script>\nfunction koszont() {\n    const nev = document.getElementById('nev').value.trim();\n    document.getElementById('uzenet').textContent =\n        nev ? 'Szia, ' + nev + '! Ezt már te irányítod.' : 'Előbb írj be egy becenevet!';\n}\n<\/script>\n</html>"; const source=document.getElementById('source');source.value=starter;
function update(){document.getElementById('preview').srcdoc=source.value;document.getElementById('status').textContent='Frissült az oldal. Most próbáld ki a jobb oldalon!'}
document.getElementById('update').onclick=update;update();</script></html>
