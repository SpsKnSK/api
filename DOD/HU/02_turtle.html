<!doctype html><html lang="hu"><meta charset="utf-8"><title>Színes Python</title><link rel="stylesheet" href="stilus.css"><main><a href="index.html">← Állomások</a><h1>A te mintád, a te számaid</h1><p>Futtasd, válaszolj a kérdésekre, majd változtass a kódon!</p><button id="run">Futtatás ▶</button> <button class="secondary" onclick="location.reload()">Újrakezdés - leállítás</button><p id="status" role="status"></p><div class="cols"><textarea id="code" aria-label="Python kód" spellcheck="false"></textarea><div><div id="canvas"></div><pre id="out"></pre></div></div><p class="note">Kihívás: próbálj ki másik síkidomot! Melyik beállításokat kell átírnod?</p></main><script src="skulpt.min.js"></script><script src="skulpt-stdlib.js"></script><script>
const starter="#https://www.online-python.com/turtle\n\nimport turtle\n\n#sikidom, oldalszam, szog = \"négyzet\", 4, 90\nsikidom, oldalszam, szog = \"háromszög\", 3, 120\n\ndarab = int(input(f\"Hány színes {sikidom} legyen? (3-36): \"))\nmeret = int(input(\"Mekkora legyen az oldaluk? (30-120): \"))\ndarab = max(3, min(36, darab))\nmeret = max(30, min(120, meret))\n\nablak = turtle.Screen()\nablak.bgcolor(\"#0b1220\")\nt = turtle.Turtle()\nt.speed(0)\nt.pensize(3)\nszinek = [\"cyan\", \"magenta\", \"yellow\", \"lime\", \"orange\"]\n\nfor i in range(darab):\n    t.color(szinek[i % len(szinek)])\n    for oldal in range(oldalszam):\n        t.forward(meret)\n        t.right(szog)\n    t.right(360 / darab)\n\nt.hideturtle()\nprint(\"Kész! Futtasd újra más számokkal!\")\n\n# Kihívás: változtasd meg a síkidomot és az oldalak számát!\n";
document.getElementById('code').value=starter;
document.getElementById('run').onclick=async()=>{
const run=document.getElementById('run'),status=document.getElementById('status'),out=document.getElementById('out');
run.disabled=true;out.textContent='';document.getElementById('canvas').innerHTML='';status.textContent='Fut a program…';
try{if(!window.Sk)throw new Error('Hiányzik a Python motor. A teljes mappát csomagold ki!');
Sk.configure({output:t=>out.textContent+=t,read:x=>{if(Sk.builtinFiles?.files[x]===undefined)throw new Error('Nincs ilyen modul: '+x);return Sk.builtinFiles.files[x]},__future__:Sk.python3,inputfun:q=>{const v=prompt(q);if(v===null)throw new Error('Megszakítottad a bevitelt.');return v},inputfunTakesPrompt:true,execLimit:15000});
Sk.TurtleGraphics={target:'canvas',width:520,height:430};
await Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody('<stdin>',false,document.getElementById('code').value,true));status.textContent='Kész! Próbálj ki más számokat is.';
}catch(e){status.textContent='Nézd meg a hibaüzenetet, javíts, és próbáld újra!';out.textContent+=e.toString()}finally{run.disabled=false}};
</script></html>
