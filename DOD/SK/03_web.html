<!doctype html><html lang="sk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webová dielňa</title><link rel="stylesheet" href="../shared/stilus.css"><main><a href="index.html">← Späť na stanovištia</a><h1>Webová stránka, ktorú si upravíš</h1><p>1. Zmeň text tlačidla „Pozdrav ma!".<br>2. Nájdi slovo <b>hidden</b> a vymaž ho.<br>3. Vyskúšaj inú farbu pozadia!</p><button id="update">Zobraziť zmeny ▶</button><p id="status" role="status"></p><div class="cols"><textarea id="source" aria-label="Zdrojový kód stránky" spellcheck="false"></textarea><iframe id="preview" sandbox="allow-scripts" title="Tvoja vlastná stránka"></iframe></div><p class="note">Prezývka sa zobrazí iba na tomto počítači. Skúšobná stránka ju nikam neodosiela.</p></main><script>
const starter="<!doctype html>\n<html lang=\"sk\">\n<meta charset=\"utf-8\">\n<style>\nbody { background: #152440; color: white; font-family: Arial; text-align: center; padding: 35px; }\nh1 { color: #55e4e7; }\nbutton { background: #55e4e7; border: 0; padding: 15px; font-size: 18px; cursor: pointer; }\ninput { padding: 12px; font-size: 18px; max-width: 90%; }\n</style>\n<h1>Moja prvá vlastná stránka</h1>\n<p>Aká je tvoja prezývka?</p>\n<input id=\"nev\" placeholder=\"Napr. Pixel\" maxlength=\"30\">\n<button onclick=\"koszont()\">Pozdrav ma!</button>\n<h2 id=\"uzenet\">Tu sa zobrazí tvoja správa.</h2>\n<!-- TAJNÁ ÚLOHA: z nasledujúceho riadka vymaž slovo hidden! -->\n<p hidden>★ Našiel/našla si tajnú správu!</p>\n<script>\nfunction koszont() {\n    const nev = document.getElementById('nev').value.trim();\n    document.getElementById('uzenet').textContent =\n        nev ? 'Ahoj, ' + nev + '! Teraz to už ovládaš ty.' : 'Najprv zadaj prezývku!';\n}\n<\/script>\n</html>"; const source=document.getElementById("source");source.value=starter;
function update(){document.getElementById('preview').srcdoc=source.value;document.getElementById('status').textContent='Stránka je aktualizovaná. Teraz ju vyskúšaj vpravo!'}
document.getElementById('update').onclick=update;update();</script></html>
