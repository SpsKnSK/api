<!doctype html><html lang="sk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farebný Python</title><link rel="stylesheet" href="stilus.css"><main><a href="index.html">← Späť na stanovištia</a><h1>Tvoj vzor, tvoje čísla</h1><p>Spusť program, odpovedz na otázky a potom uprav kód!</p><button id="run">Spustiť ▶</button> <button class="secondary" onclick="location.reload()">Začať znova - zastaviť</button><p id="status" role="status"></p><div class="cols"><textarea id="code" aria-label="Kód v Pythone" spellcheck="false"></textarea><div><div id="canvas"></div><pre id="out"></pre></div></div><p class="note">Výzva: vyskúšaj iný geometrický útvar! Ktoré nastavenia musíš zmeniť?</p></main><script src="skulpt.min.js"></script><script src="skulpt-stdlib.js"></script><script>
const starter="# https://www.online-python.com/turtle\n\nimport turtle\n\n# utvar, pocet_stran, uhol = \"štvorec\", 4, 90\nutvar, pocet_stran, uhol = \"trojuholník\", 3, 120\n\npocet = int(input(f\"Koľko farebných útvarov v tvare {utvar} mám nakresliť? (3-36): \"))\nvelkost = int(input(\"Aké dlhé majú byť strany? (30-120): \"))\npocet = max(3, min(36, pocet))\nvelkost = max(30, min(120, velkost))\n\nokno = turtle.Screen()\nokno.bgcolor(\"#0b1220\")\nt = turtle.Turtle()\nt.speed(0)\nt.pensize(3)\nfarby = [\"cyan\", \"magenta\", \"yellow\", \"lime\", \"orange\"]\n\nfor i in range(pocet):\n    t.color(farby[i % len(farby)])\n    for strana in range(pocet_stran):\n        t.forward(velkost)\n        t.right(uhol)\n    t.right(360 / pocet)\n\nt.hideturtle()\nprint(\"Hotovo! Spusť program znova s inými číslami!\")\n\n# Výzva: zmeň geometrický útvar a počet jeho strán!\n";
document.getElementById('code').value=starter;
document.getElementById('run').onclick=async()=>{
const run=document.getElementById('run'),status=document.getElementById('status'),out=document.getElementById('out');
run.disabled=true;out.textContent='';document.getElementById('canvas').innerHTML='';status.textContent='Program sa spúšťa…';
try{if(!window.Sk)throw new Error('Chýba Python runtime. Rozbaľ celý priečinok!');
Sk.configure({output:t=>out.textContent+=t,read:x=>{if(Sk.builtinFiles?.files[x]===undefined)throw new Error('Modul neexistuje: '+x);return Sk.builtinFiles.files[x]},__future__:Sk.python3,inputfun:q=>{const v=prompt(q);if(v===null)throw new Error('Vstup si zrušil/a.');return v},inputfunTakesPrompt:true,execLimit:15000});
Sk.TurtleGraphics={target:'canvas',width:520,height:430};
await Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody('<stdin>',false,document.getElementById('code').value,true));status.textContent='Hotovo! Skús aj iné čísla.';
}catch(e){status.textContent='Pozri si chybovú správu, oprav kód a skús znova!';out.textContent+=e.toString()}finally{run.disabled=false}};
</script></html>
