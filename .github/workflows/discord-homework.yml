name: Discord homework scheduler

on:
  schedule:
    # UTC, every 5 minutes. GitHub may delay scheduled runs.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-homework-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout workflow scripts from main
        uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false

      - name: Checkout scheduled homework from separate branch
        uses: actions/checkout@v4
        with:
          ref: homework-scheduler
          path: queue

      - name: Dispatch due messages to Discord
        env:
          DISCORD_WEBHOOK_URL_HU: ${{ secrets.DISCORD_WEBHOOK_URL_HU }}
          DISCORD_WEBHOOK_URL_SK: ${{ secrets.DISCORD_WEBHOOK_URL_SK }}
        run: python3 app/scripts/dispatch_homework.py queue/homeworks.json
